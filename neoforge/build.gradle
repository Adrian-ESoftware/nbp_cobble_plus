plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    modImplementation "com.cobblemon:neoforge:${rootProject.cobblemon_version}"

    implementation "thedarkcolour:kotlinforforge-neoforge:${rootProject.ktff_version}"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }

    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")

    // RotomAI: LangChain4j não é um mod NeoForge, então precisa ser incluído (shadow) direto no jar,
    // igual à saída do :common acima. slf4j é excluído porque o próprio NeoForge já traz um módulo
    // org.slf4j; empacotar outra cópia quebra o resolvedor de módulos do JPMS (erro visto: "Modules
    // org.slf4j and nbp_cobble_plus export package org.slf4j.event to module ponder").
    shadowBundle("dev.langchain4j:langchain4j:${rootProject.langchain4j_version}") {
        exclude group: "org.slf4j"
    }
    shadowBundle("dev.langchain4j:langchain4j-open-ai:${rootProject.langchain4j_version}") {
        exclude group: "org.slf4j"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "mod_name", rootProject.mod_name

    filesMatching("META-INF/neoforge.mods.toml") {
        expand project.properties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    // Evita colisão com outras cópias de Jackson que outros mods possam empacotar.
    relocate "com.fasterxml.jackson", "com.nbp.cobbleplus.shadow.jackson"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
