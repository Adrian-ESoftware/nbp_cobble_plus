plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${rootProject.fabric_kotlin_version}"

    modImplementation "com.cobblemon:fabric:${rootProject.cobblemon_version}"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }

    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    // RotomAI: LangChain4j não é um mod Fabric, então precisa ser incluído (shadow) direto no jar,
    // igual à saída do :common acima. slf4j é excluído porque o próprio Minecraft/loader já traz
    // um módulo org.slf4j; empacotar outra cópia quebra o resolvedor de módulos do JPMS.
    shadowBundle("dev.langchain4j:langchain4j:${rootProject.langchain4j_version}") {
        exclude group: "org.slf4j"
    }
    shadowBundle("dev.langchain4j:langchain4j-open-ai:${rootProject.langchain4j_version}") {
        exclude group: "org.slf4j"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "mod_name", rootProject.mod_name

    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    // Evita colisão com outras cópias de Jackson que outros mods possam empacotar.
    relocate "com.fasterxml.jackson", "com.nbp.cobbleplus.shadow.jackson"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
