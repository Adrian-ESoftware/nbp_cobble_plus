architectury {
    common rootProject.enabled_platforms.split(",")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // API comum do Cobblemon
    modImplementation "com.cobblemon:mod:${rootProject.cobblemon_version}"

    // RotomAI: cliente LangChain4j + integração OpenAI-compatível (usada com OpenRouter).
    // Não é um mod Fabric/NeoForge, então precisa ser "shadada" pro jar final por cada plataforma
    // (ver shadowBundle em fabric/build.gradle e neoforge/build.gradle).
    implementation "dev.langchain4j:langchain4j:${rootProject.langchain4j_version}"
    implementation "dev.langchain4j:langchain4j-open-ai:${rootProject.langchain4j_version}"

    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.1.21"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
